<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nilz Dish</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0f0f0f;
            color: white;
        }
        
        header {
            display: flex;
            justify-content: space-between;
            padding: 20px 50px;
            background: #111;
        }
        
        header h1 {
            color: #ff4d4d;
        }
        
        nav a {
            color: white;
            margin-left: 20px;
            text-decoration: none;
        }
        
        .hero {
            text-align: center;
            padding: 100px 20px;
        }
        
        .hero h2 {
            font-size: 40px;
        }
        
        .hero p {
            margin: 20px 0;
            color: #ccc;
        }
        
        .btn {
            padding: 15px 30px;
            background: #ff4d4d;
            border: none;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }
        
        .btn:hover {
            background: #ff1a1a;
        }
        
        .menu {
            padding: 50px;
            text-align: center;
        }
        
        .menu h2 {
            margin-bottom: 30px;
        }
        
        .items {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }
        
        .item {
            background: #1a1a1a;
            padding: 15px;
            border-radius: 10px;
            width: 180px;
        }
        
        .item img {
            width: 100%;
            border-radius: 10px;
        }
        
        .item h3 {
            margin-top: 10px;
        }
        
        footer {
            text-align: center;
            padding: 20px;
            background: #111;
            margin-top: 50px;
        }
    </style>
</head>

<body>

    <header>
        <h1>Nilz Dish 🍕</h1>
        <nav>
            <a href="#">Home</a>
            <a href="#">Menu</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <section class="hero">
        <h2>Delicious Food Delivered Fast</h2>
        <p>Pizza, Tacos, Sandwiches & Shawarma</p>
        <button class="btn">Order Now</button>
    </section>

    <section class="menu">
        <h2>Our Menu</h2>
        <div class="items">

            <div class="item">
                <img src="pizza.jpg">
                <h3>Pizza</h3>
            </div>

            <div class="item">
                <img src="tacos.jpg">
                <h3>Tacos</h3>
            </div>

            <div class="item">
                <img src="sandwitch.jpg">
                <h3>Sandwich</h3>
            </div>

            <div class="item">
                <img src="shawarma.jpg">
                <h3>Shawarma</h3>
            </div>

        </div>
    </section>

    <footer>
        <p>© 2026 Nilz Dish - All rights reserved</p>
    </footer>

</body>

</html>
